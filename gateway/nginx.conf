# One entry point for the three services. Mounted as /etc/nginx/conf.d/default.conf.
server {
    listen 80;
    server_name _;

    # A bit more than the 2 MB avatar limit, so the service (not nginx) answers 413 with a clear message.
    client_max_body_size 3m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The services reuse this id in their logs and error bodies.
    proxy_set_header X-Request-Id $request_id;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # No URI after the upstream address: nginx passes the original path unchanged.
    # The prefixes have no trailing slash on purpose, so GET /api/profiles?q=... (the search) matches too.
    location /api/auth {
        proxy_pass http://auth-service:4001;
    }

    location /api/profiles {
        proxy_pass http://profile-service:4002;
    }

    location /api/catalog {
        proxy_pass http://catalog-service:4003;
    }

    location / {
        default_type application/json;
        return 404 '{"statusCode":404,"error":"Not Found","message":"Use /api/auth/, /api/profiles/ or /api/catalog/"}';
    }
}
