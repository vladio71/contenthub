# Everything for local use:  docker compose up --build
# Gateway: http://localhost:8081   Mongo: localhost:27017   Mock OAuth: http://localhost:9000
# Swagger: http://localhost:4001/docs  (auth)  :4002/docs (profiles)  :4003/docs (catalog)

x-service-env: &service-env
  NODE_ENV: production
  MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}

services:
  # Single node replica set. Transactions (likes, collections) do not work without a replica set.
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Healthy only when this node is PRIMARY. If the set is not initiated yet, initiate it and report "not yet".
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { if (rs.status().myState === 1) { quit(0) } else { quit(1) } } catch (e) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] }); quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  mock-oauth:
    build:
      context: .
      args:
        APP: mock-oauth
    environment:
      PORT: "9000"
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build:
      context: .
      args:
        APP: auth-service
    environment:
      <<: *service-env
      PORT: "4001"
      # The mock provider is the default, so nothing needs secrets.
      # The browser is sent to localhost:9000. The service itself calls mock-oauth by its docker name.
      GITHUB_CLIENT_ID: mock-client-id
      GITHUB_CLIENT_SECRET: mock-client-secret
      GITHUB_AUTHORIZE_URL: http://localhost:9000/authorize
      GITHUB_TOKEN_URL: http://mock-oauth:9000/access_token
      GITHUB_API_URL: http://mock-oauth:9000
      GITHUB_REDIRECT_URI: http://localhost:8081/api/auth/github/callback
    ports:
      - "4001:4001"
    depends_on:
      mongo:
        condition: service_healthy
      mock-oauth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/api/auth/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  profile-service:
    build:
      context: .
      args:
        APP: profile-service
    environment:
      <<: *service-env
      PORT: "4002"
      AVATAR_DIR: /data/avatars
    volumes:
      - avatars:/data/avatars
    ports:
      - "4002:4002"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4002/api/profiles/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  catalog-service:
    build:
      context: .
      args:
        APP: catalog-service
    environment:
      <<: *service-env
      PORT: "4003"
    ports:
      - "4003:4003"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4003/api/catalog/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy

volumes:
  mongo-data:
  avatars:
